<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="suiBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54a6ff" />
      <stop offset="50%" stop-color="#298dff" />
      <stop offset="100%" stop-color="#0f5ec2" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe0ff" />
      <stop offset="50%" stop-color="#54a6ff" />
      <stop offset="100%" stop-color="#298dff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000000" />

  <!-- Outer Glowing Triangle / Chevron -->
  <path
    d="M 256 80 
       C 264 80, 270 85, 275 94
       L 426 360
       C 434 374, 426 392, 410 398
       C 403 400, 395 398, 389 392
       L 338 335
       C 334 330, 328 315, 320 300
       L 262 186
       C 259 180, 253 180, 250 186
       L 192 300
       C 184 315, 178 330, 174 335
       L 123 392
       C 117 398, 109 400, 102 398
       C 86 392, 78 374, 86 360
       L 237 94
       C 242 85, 248 80, 256 80 Z"
    fill="url(#suiBlueGrad)"
    filter="url(#glow)"
  />

  <!-- Central Luminous 4-Point Star -->
  <path
    d="M 256 260
       Q 256 310 216 310
       Q 256 310 256 360
       Q 256 310 296 310
       Q 256 310 256 260 Z"
    fill="url(#starGrad)"
    filter="url(#glow)"
  />
</svg>
